# DSH remote-aware web-startup + auth bundle.
#
# This patch is meant to be applied AFTER the web-app bundle layer, so it can:
#   1. disable the stock web-startup (which hard-rejects --host 0.0.0.0)
#   2. insert a remote-capable startup that provides the same webStartup service
#   3. insert an auth plugin with front-end login/register
#   4. patch the `connection` row to inject `webAuth` so it waits for the auth
#      plugin to wrap the webserver's route registration.
#
# Usage:
#   dsh --profile web --patch ./cordis.patch.yml --host 0.0.0.0

- id: web-startup
  disabled: true

- id: connection
  # webLanHosts is required by the trustedHosts expression below: cordis
  # gates ctx.<service> access on inject declarations (ungated access throws).
  inject: [webServer, webRuntime, webAuth, webLanHosts]
  config:
    # web-app's own expression derives LAN IPv4 literals from the active bind
    # plus --trusted-host extras; we keep it and append what it can never
    # produce: the IPv6 authorities, and — on the dual-stack `::` bind, whose
    # socket answers IPv4-mapped clients too — the IPv4 literals resolveLanTrust
    # only derives for `0.0.0.0` (issue #35). Entries are bracketed/plain
    # authorities matching the fence's WHATWG-form hostname normalization.
    trustedHosts: !!js "[...ctx.webRuntime.trustedHosts, ...ctx.webLanHosts?.(ctx.webServer.host) ?? []]"

- insert:
    - id: dsh-web-startup-auth
      name: dsh-web-startup-auth

    - id: remote-web-startup
      name: dsh-web-startup-auth/startup

    - id: web-auth
      name: dsh-web-startup-auth/auth